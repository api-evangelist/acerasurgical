aid: acerasurgical
name: Acera Surgical
description: >-
  Acera Surgical Inc. is a St. Louis, Missouri bioscience company founded in 2013 that develops and
  commercializes fully engineered, 100% synthetic materials for regenerative wound care and soft
  tissue repair, built on a proprietary electrospun nanofiber technology platform. Its Restrata
  product family — Restrata Sheet, Restrata Meshed and Restrata MiniMatrix — is a fully resorbable
  synthetic matrix used to treat hard-to-heal and complex wounds in acute care settings, and its
  Cerafix implant addresses dural repair and cerebrospinal fluid leakage. Acera was acquired by
  Solventum Corporation on December 23, 2025 for $725 million in cash plus up to $125 million in
  milestone payments, and now sits inside Solventum's Medical segment MedSurg portfolio. Acera is a
  medical device manufacturer, not a software company: it publishes no API, developer portal, SDK,
  or machine-readable interface of any kind.
