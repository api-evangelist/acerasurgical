  partner_name: FDA 510(k) premarket notifications (IVD / surgical panels)
  category: FDA-cleared IVD / surgical device
  type: contract
  channel: regulator-register
  evidence: https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpmn/pmn.cfm?ID=K251224
  source: edge
  relationship: standard-participant
  contract_reference:
    register: openFDA device/510k (decision_date >= 2016-01-01; panels CH HE IM MI PA TX SU OR)
    standard: FDA 510(k) premarket clearance (IVD / surgical panels)
    spec_file: null
    role: fda-510k-holder
    registered_name: Acera Surgical, Inc.
    matched_domain: null
    matched_by: register-name
    detected_by: sweep-ivd-diagnostics.py
    detected: '2026-10-21'
    register_id: K251224
    certified_products:
    - product: FDA 510(k) clearance, General & Plastic Surgery panel
      product_type: General & Plastic Surgery
      review_panel: SU
      lapsed: false
      latest_decision: '2025-06-20'
      devices_sample:
      - Restrata Soft Tissue Reinforcement (STR)
    signal_note: certified_products = one entry per FDA review PANEL held, never per device; openFDA carries decisions,
      not withdrawals, so lapsed is always false
    register_name_note: register-name 'acerasurgical' = acerasurgical; no wikidata P856
    identity_source: register-name
