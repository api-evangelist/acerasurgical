# Acera Surgical integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in acerasurgical-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: acerasurgical-fda-510-k-premarket-notifications-ivd-surgical-panels
